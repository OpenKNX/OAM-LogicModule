[RP2350_DEBUG_SERVER]
debug_server = 
    C:\Program Files\SEGGER\JLink\JLinkGDBServerCL
    -nohalt
    -nologtofile
    -endian 
    little
    -if
    SWD
    -speed
    4000
    -select
    USB
    -port
    2331
    -device
    RP2350_M33_0

;
; global custom
;
[custom]
build_flags =
  -D LOGICMODULE
  ; add OPENKNX_WATCHDOG normal only in releases and not here
  -D OPENKNX_WATCHDOG
  ; -D OPENKNX_DEBUGGER
  -D OPENKNX_LOOPTIME_WARNING=100
  ; -D DEBUG_TP_FRAMES
  ; -D OPENKNX_DUALCORE
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[custom_develop]
extends = custom
build_flags =
  ${custom.build_flags}
  -D OPENKNX_HEARTBEAT
  -D OPENKNX_DEBUG
  ; -D OPENKNX_DEBUGGER
  ; -D OPENKNX_RUNTIME_STAT
  ; -D OPENKNX_RUNTIME_STAT_BUCKETN=7
  ; "-D OPENKNX_RUNTIME_STAT_BUCKETS=100, 200, 500, 1000, 2000, 5000"
  ; -D OPENKNX_HEARTBEAT_PRIO
  ; -D OPENKNX_RTT
  ; -D BUFFER_SIZE_UP=10240
  ; -D LOGIC_TRACE
  ; ; to see trace logs, they must match one of the 5 filters (TRACE_LOG1 .. TRACE_LOG2)
  ; "-D OPENKNX_TRACE1=Meter.*"
  ; "-D OPENKNX_TRACE1=Common.*"
  ; "-D OPENKNX_TRACE1=Button.*"
  ; "-D OPENKNX_TRACE2=Flash.*"
  ; "-D OPENKNX_TRACE3=DummyChannel<1>"
  ; "-D OPENKNX_TRACE4=DummyChannel<[3-5]>"

[custom_releases]
extends = custom
build_flags =
  ${custom.build_flags}

; RP2040
[RP2040_custom]
extends = RP2040, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -D USE_KNX_DMA_UART=0
  -D USE_KNX_DMA_IRQ=0
  -Wunused-variable
  ; -D DEBUG_TP_FRAMES

[env:develop_RP2040]
extends = RP2040_develop, RP2040_custom, custom_develop, RP2040_EXCHANGE_16MB
build_flags =
  ${KNX_TP.build_flags}
  ${RP2040_develop.build_flags}
  ${RP2040_custom.build_flags}
  ${custom_develop.build_flags}
  ${RP2040_EXCHANGE_16MB.build_flags}
  ; -D DEVICE_REG1_BASE_V1
  ; -D DEVICE_REG1_SEN_MULTI
  -D DEVICE_PIPICO_BCU_CONNECTOR
  ; -D SML_TEST_STRINGS

[env:develop_RP2040_JLINK]
extends = env:develop_RP2040, UPLOAD_JLINK


; ESP32
[ESP32_custom]
extends = ESP32, custom
build_flags =
  -D SERIAL_DEBUG=Serial
  -I lib/OGM-HardwareConfig/include
  -D OPENKNX_USB_EXCHANGE_IGNORE
  -D OPENKNX_LED_TIME=info3Led
  -D OPENKNX_OVERRIDE_MASK_VERSION=0x07B0

[env:release_DEVICE_REG1_LAN_TP_Base]
extends = ESP32_releases, ESP32_custom, ESP32_8MB
build_flags =
  ${KNX_IP.build_flags}
  ${ESP32_releases.build_flags}
  ${ESP32_custom.build_flags}
  ${custom_releases.build_flags}
  -D DEVICE_REG1_LAN_TP_BASE
  -D KNX_IP_LAN
  ; -D CONFIG_ETH_ENABLED #only for ESP32







